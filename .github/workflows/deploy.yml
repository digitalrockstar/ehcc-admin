name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ehcc-production
  cancel-in-progress: false

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci-test.db
      ADMIN_PASSWORD: ci-admin-password
      SECRET_KEY: ci-only-secret-key
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, ehcc-prod]
    timeout-minutes: 20
    steps:
      - name: Deploy latest main to EC2
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /opt/ehcc-admin
          git fetch --prune origin main
          git reset --hard origin/main
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          set -a
          source .env
          set +a
          .venv/bin/alembic upgrade head
          sudo systemctl restart ehcc
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/healthz; then
              printf '\nDeployment healthy.\n'
              exit 0
            fi
            sleep 3
          done
          sudo journalctl -u ehcc -n 100 --no-pager
          exit 1
