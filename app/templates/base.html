<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}EHCC Accounts{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: { colors: {
      pitch: '#0b3d1e', gold: '#c9a227', ink: '#0f1115', card: '#151922'
    }}}
  }
</script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  .card { background: linear-gradient(145deg, #151922, #10131a); border: 1px solid #24293a; }
</style>
</head>
<body class="bg-ink text-gray-100 min-h-screen">
<nav class="bg-card border-b border-gray-800 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
  <a href="/" class="text-gold font-bold text-lg tracking-wide">EHCC {% if team %}· {{ team.name }}{% endif %}</a>
  <div class="flex gap-3 text-sm overflow-x-auto">
    <a href="/" class="hover:text-gold">Dashboard</a>
    <a href="/matches" class="hover:text-gold">Matches</a>
    <a href="/players" class="hover:text-gold">Players</a>
    <a href="/expenses" class="hover:text-gold">Expenses</a>
    <a href="/reimbursements" class="hover:text-gold">Reimbursements</a>
    <a href="/income" class="hover:text-gold">Income</a>
    <a href="/reports" class="hover:text-gold">Reports</a>
    <a href="/setup" class="hover:text-gold">Settings</a>
  </div>
</nav>
<main class="max-w-6xl mx-auto p-4">
{% block content %}{% endblock %}
</main>
</body>
</html>
