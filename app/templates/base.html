<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}EHCC Accounts{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    ink: 'var(--ink)', card: 'var(--card)', gold: 'var(--accent)', border: 'var(--border)'
  }}}}
</script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="/static/themes.css">
</head>
<body data-theme="{{ request.cookies.get('ehcc_theme', 'dark') }}" class="bg-ink min-h-screen">
<nav class="bg-card border-b border-gray-800 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
  <a href="/" class="text-gold font-bold text-lg tracking-wide">EHCC {% if team %}· {{ team.name }}{% endif %}</a>
  <div class="flex gap-3 text-sm overflow-x-auto">
    <a href="/" class="hover:text-gold">Dashboard</a>
    <a href="/matches" class="hover:text-gold">Matches</a>
    <a href="/players" class="hover:text-gold">Players</a>
    <a href="/expenses" class="hover:text-gold">Expenses</a>
    <a href="/reimbursements" class="hover:text-gold">Reimbursements</a>
    <a href="/income" class="hover:text-gold">Income</a>
    <a href="/reports" class="hover:text-gold">Reports</a>
    <a href="/setup" class="hover:text-gold">Settings</a>
    <form method="post" action="/theme" class="inline">
      <select name="theme" onchange="this.form.submit()" class="bg-card border border-gray-700 rounded text-xs px-2 py-1">
        {% for t in ["dark","light","cricket-green","midnight","maroon","royal-blue","monochrome","luxury-gold"] %}
        <option value="{{ t }}" {{ 'selected' if request.cookies.get('ehcc_theme','dark')==t else '' }}>{{ t|replace('-', ' ')|title }}</option>
        {% endfor %}
      </select>
    </form>
  </div>
</nav>
<main class="max-w-6xl mx-auto p-4">
{% block content %}{% endblock %}
</main>
</body>
</html>
