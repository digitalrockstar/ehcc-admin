<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}EHCC Accounts{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ css_version }}">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: { colors: {
    ink: 'var(--ink)', card: 'var(--card)', gold: 'var(--accent)', border: 'var(--border)'
  }, fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } }}}
</script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<link rel="stylesheet" href="/static/themes.css?v={{ css_version }}">
</head>
<body data-theme="{{ request.cookies.get('ehcc_theme', 'dark') }}" class="bg-ink text-white min-h-screen font-sans">

<input type="checkbox" id="nav-toggle" class="peer hidden">
<label for="nav-toggle" class="fixed inset-0 bg-black/60 z-40 hidden peer-checked:block md:hidden"></label>

<aside class="fixed inset-y-0 left-0 z-50 w-64 bg-card border-r border-border p-4 flex flex-col gap-1
              transform -translate-x-full peer-checked:translate-x-0 md:translate-x-0 transition-transform duration-200">
  <div class="flex items-center justify-between mb-4">
    <a href="/" class="text-gold font-bold text-lg tracking-wide">EHCC</a>
    <label for="nav-toggle" class="md:hidden cursor-pointer text-2xl leading-none px-2">&times;</label>
  </div>

  {% if teams %}
  <form method="post" action="/team-switch" class="mb-3">
    <select name="team_id" onchange="this.form.submit()"
            class="w-full bg-ink border border-border rounded px-2 py-2 text-sm">
      {% for t in teams %}
      <option value="{{ t.id }}" {% if team and t.id == team.id %}selected{% endif %}>{{ t.name }}</option>
      {% endfor %}
    </select>
  </form>
  {% endif %}

  <a href="/{{ '?team_id=' ~ team.id if team else '' }}" class="px-3 py-2 rounded hover:bg-black/20 hover:text-gold text-sm flex items-center gap-2">📊 Dashboard</a>
  <a href="/transactions/new{{ '?team_id=' ~ team.id if team else '' }}" class="px-3 py-2 rounded hover:bg-black/20 hover:text-gold text-sm flex items-center gap-2">➕ Add Transaction</a>
  <a href="/transactions{{ '?team_id=' ~ team.id if team else '' }}" class="px-3 py-2 rounded hover:bg-black/20 hover:text-gold text-sm flex items-center gap-2">📜 Transactions</a>
  <a href="/players{{ '?team_id=' ~ team.id if team else '' }}" class="px-3 py-2 rounded hover:bg-black/20 hover:text-gold text-sm flex items-center gap-2">👥 Players</a>
  <a href="/settings" class="px-3 py-2 rounded hover:bg-black/20 hover:text-gold text-sm flex items-center gap-2">⚙️ Settings</a>

  <div class="mt-auto pt-3 border-t border-border">
    <form method="post" action="/theme" class="flex flex-col gap-1">
      <label class="text-xs text-text-dim px-3">Theme</label>
      <select name="theme" onchange="this.form.submit()" class="bg-ink border border-border rounded px-2 py-1 text-xs mx-3">
        {% for th in ['dark','light','cricket-green','midnight','maroon','royal-blue','monochrome','luxury-gold','sky','sandstone','blossom','seafoam','linen','sunset','neon','tropical','electric-violet','citrus','crimson-steel','mint-slate'] %}
        <option value="{{ th }}" {% if request.cookies.get('ehcc_theme','dark') == th %}selected{% endif %}>{{ th }}</option>
        {% endfor %}
      </select>
    </form>
  </div>
</aside>

<div class="md:pl-64 min-h-screen">
  <header class="md:hidden flex items-center gap-3 p-4 border-b border-border sticky top-0 bg-ink z-30">
    <label for="nav-toggle" class="cursor-pointer text-2xl leading-none">&#9776;</label>
    <a href="/" class="text-gold font-bold">EHCC{% if team %} · {{ team.name }}{% endif %}</a>
  </header>
  <main class="max-w-6xl mx-auto p-4">
  {% block content %}{% endblock %}
  </main>
</div>

</body>
</html>
