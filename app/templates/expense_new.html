{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold text-gold mb-4">New Team Expense</h1>
<form method="post" action="/expenses" class="card rounded-xl p-6 max-w-lg space-y-4" x-data="{ source: 'account' }">
  <div>
    <label class="block text-sm text-gray-400 mb-1">Date</label>
    <input type="date" name="date" required class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
  </div>
  <div>
    <label class="block text-sm text-gray-400 mb-1">Category</label>
    <select name="category" class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
      {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-sm text-gray-400 mb-1">Amount (₹)</label>
    <input type="number" step="0.01" name="amount" required class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
  </div>
  <div>
    <label class="block text-sm text-gray-400 mb-1">Payment Source</label>
    <select name="payment_source" id="payment_source" onchange="document.getElementById('paidByWrap').classList.toggle('hidden', this.value !== 'player')" class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
      <option value="account">Team Account</option>
      <option value="player">Player (personally paid)</option>
    </select>
  </div>
  <div id="paidByWrap" class="hidden">
    <label class="block text-sm text-gray-400 mb-1">Paid By</label>
    <select name="paid_by_player_id" class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
      {% for p in players %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
    </select>
  </div>
  <button class="bg-gold text-ink font-semibold px-4 py-2 rounded">Save Expense</button>
</form>
{% endblock %}
