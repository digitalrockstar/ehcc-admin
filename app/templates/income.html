{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold text-gold mb-4">Additional Income</h1>

<form method="post" action="/income" class="card rounded-xl p-4 mb-6 grid grid-cols-2 gap-3">
  <input type="date" name="date" required class="bg-ink border border-gray-700 rounded px-3 py-2">
  <select name="income_type" class="bg-ink border border-gray-700 rounded px-3 py-2">
    {% for t in types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
  </select>
  <input type="number" step="0.01" name="amount" placeholder="Amount (₹)" required class="bg-ink border border-gray-700 rounded px-3 py-2">
  <input name="notes" placeholder="Notes (optional)" class="bg-ink border border-gray-700 rounded px-3 py-2">
  <button class="col-span-2 bg-gold text-ink font-semibold px-4 py-2 rounded">Record Income</button>
</form>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
  {% for i in income %}
  <div class="card rounded-xl p-4 text-sm">
    <p class="font-medium">{{ i.income_type }}</p>
    <p class="text-gold font-semibold">₹{{ i.amount }}</p>
    <p class="text-gray-400">{{ i.date }}{% if i.notes %} · {{ i.notes }}{% endif %}</p>
  </div>
  {% else %}<p class="text-gray-500 col-span-full text-sm">No additional income recorded yet.</p>{% endfor %}
</div>
{% endblock %}
