{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold text-gold mb-4">Edit Income</h1>
<form method="post" action="/income/{{ income.id }}/edit" class="max-w-xl space-y-4">
  <input type="date" name="date" value="{{ income.date }}" required class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
  <select name="income_type" class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
    {% for t in types %}<option value="{{ t }}" {{ 'selected' if t == income.income_type }}>{{ t }}</option>{% endfor %}
  </select>
  <input type="text" inputmode="decimal" pattern="[0-9]*.?[0-9]*" name="amount" value="{{ income.amount }}" required class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
  <input name="notes" value="{{ income.notes or '' }}" placeholder="Notes (optional)" class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
  <button class="bg-gold text-ink font-semibold px-4 py-2 rounded">Save Changes</button>
</form>
{% endblock %}
