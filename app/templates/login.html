{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Admin login</h1>
  {% if not configured %}<p class="flash err">ADMIN_PASSWORD is not set on the server, so admin login is disabled.</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Your name <input name="name" maxlength="40" required autocomplete="name"></label>
    <label>Admin password <input type="password" name="password" required autocomplete="current-password"></label>
    <p class="hint">Your name is written to the audit log next to every change you make.</p>
    <button class="btn">Log in</button>
  </form>
</div>
{% endblock %}
