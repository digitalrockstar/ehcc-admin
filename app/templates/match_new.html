{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold text-gold mb-4">New Match</h1>
<form method="post" action="/matches" class="max-w-xl space-y-5">
  <div>
    <label class="block text-sm text-gray-400 mb-1">Match Date</label>
    <input type="date" name="match_date" required class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-sm text-gray-400 mb-1">Ground Fees (₹)</label>
      <input type="text" inputmode="decimal" pattern="[0-9]*.?[0-9]*" name="ground_fees" required class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm text-gray-400 mb-1">Additional Amount (₹)</label>
      <input type="text" inputmode="decimal" pattern="[0-9]*.?[0-9]*" name="additional_amount" value="0" class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
    </div>
  </div>
  <div>
    <label class="block text-sm text-gray-400 mb-1">Notes</label>
    <input name="notes" class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
  </div>
  <div>
    <label class="block text-sm text-gray-400 mb-2">Participating Players <span id="pcount" class="text-gold">[0]</span></label>
    <div id="pgrid" class="grid grid-cols-2 md:grid-cols-3 gap-2 border border-gray-800 rounded p-3">
      {% for p in players %}
      <label class="cursor-pointer relative block">
        <input type="checkbox" name="player_ids" value="{{ p.id }}" class="peer hidden">
        <div class="card rounded-lg px-3 py-2 border-2 border-transparent peer-checked:border-gold peer-checked:bg-gold/10 transition text-sm">
          <p class="font-medium">{{ p.name }}</p>
          {% if p.contact_number %}<p class="text-xs text-gray-500">{{ p.contact_number }}</p>{% endif %}
        </div>
        <span class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-gold text-ink text-xs font-bold flex items-center justify-center opacity-0 scale-75 peer-checked:opacity-100 peer-checked:scale-100 transition">✓</span>
      </label>
      {% endfor %}
    </div>
  </div>
  <script>
    (function(){
      var grid = document.getElementById('pgrid'), count = document.getElementById('pcount');
      function update(){ count.textContent = '[' + grid.querySelectorAll('input:checked').length + ']'; }
      grid.addEventListener('change', update); update();
    })();
  </script>
  <button class="bg-gold text-ink font-semibold px-4 py-2 rounded">Create Match</button>
</form>
{% endblock %}
