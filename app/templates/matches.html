{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-4">
  <h1 class="text-2xl font-bold text-gold">Matches</h1>
  <a href="/matches/new" class="bg-gold text-ink font-semibold px-4 py-2 rounded">+ New Match</a>
</div>
<div class="card rounded-xl divide-y divide-gray-800">
  {% for m in matches %}
  <a href="/matches/{{ m.id }}" class="block p-3 flex justify-between hover:bg-gray-800/40">
    <span>{{ m.match_date }}</span>
    <span class="text-gray-400">₹{{ "%.2f"|format(m.total_expense) }} · {{ m.participants|length }} players</span>
    <span class="px-2 py-0.5 rounded text-xs {{ 'bg-green-900 text-green-300' if m.status.value=='completed' else 'bg-gray-700' if m.status.value=='upcoming' else 'bg-red-900 text-red-300' }}">{{ m.status.value }}</span>
  </a>
  {% else %}
  <p class="p-4 text-gray-500">No matches yet.</p>
  {% endfor %}
</div>
{% endblock %}
