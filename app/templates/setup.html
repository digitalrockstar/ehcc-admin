{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-16 bg-card border border-border rounded-xl p-6">
  <h1 class="text-xl font-bold text-gold mb-1">Welcome to EHCC Accounts</h1>
  <p class="text-text-dim text-sm mb-4">Create your first team to get started. Every team gets its own account automatically.</p>
  <form method="post" action="/settings/teams" class="flex flex-col gap-3">
    <input name="name" placeholder="Team name" required class="bg-ink border border-border rounded px-3 py-2">
    <input name="starting_balance" inputmode="decimal" placeholder="Starting balance (₹)" value="0"
           class="bg-ink border border-border rounded px-3 py-2">
    <button class="bg-gold text-ink font-semibold rounded px-3 py-2">Create team</button>
  </form>
</div>
{% endblock %}
