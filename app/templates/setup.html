{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold text-gold mb-4">Team Setup</h1>
<form method="post" action="/setup" class="card rounded-xl p-6 max-w-md space-y-4">
  <div>
    <label class="block text-sm text-gray-400 mb-1">Team Name</label>
    <input name="name" required value="{{ team.name if team else '' }}"
      class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
  </div>
  <div>
    <label class="block text-sm text-gray-400 mb-1">Starting Balance (₹)</label>
    <input name="starting_balance" type="text" inputmode="decimal" pattern="[0-9]*.?[0-9]*" required
      value="{{ team.starting_balance if team else 0 }}"
      class="w-full bg-ink border border-gray-700 rounded px-3 py-2">
  </div>
  <button class="bg-gold text-ink font-semibold px-4 py-2 rounded hover:opacity-90">Save</button>
</form>
{% endblock %}
